<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>PlayStation — Continue?</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html, body, #game {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 360px;
    background: #111111;
    color: #F5F5F5;
    font: 13px 'Plus Jakarta Sans', 'JetBrains Mono', sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #notice {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: #9E9E9E;
    pointer-events: none;
  }
  #notice span { max-width: 520px; line-height: 1.6; }
  #notice b { color: #E60012; display: block; font-size: 16px; margin-bottom: 6px; }

  /* Botões na tela do celular (Touch) maiores e mais fáceis para crianças */
  body.touch-large .ejs_virtual_gamepad_button {
    transform: scale(1.18);
    font-weight: 800 !important;
    border-width: 2px !important;
    background-color: rgba(230, 0, 18, 0.32) !important;
    border-color: rgba(255, 255, 255, 0.65) !important;
    color: #FFFFFF !important;
  }
  body.touch-large .ejs_dpad_container {
    transform: scale(1.15);
  }
</style>
<script src="assets/storage-config.js"></script>
<script src="assets/gamepad-mapper.js"></script>
</head>
<body>
<div id="game"></div>
<div id="notice">
  <span>
    <b>💿 PREPARANDO SEU JOGO DE PLAYSTATION…</b>
    📱 No celular, os botões aparecem direto na tela!<br>
    💡 Como os jogos de CD são grandes, aguarde alguns segundos na primeira vez.
  </span>
</div>
<script>
const touchCfg = window.ContinueControls ? window.ContinueControls.getTouchSettings() : { size: 'large' };
if (touchCfg.size === 'large') document.body.classList.add('touch-large');

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const query = new URLSearchParams(location.search);
const rom = query.get('rom') || '';
const title = query.get('title') || 'Jogo de PlayStation';
const notice = document.querySelector('#notice');
document.title = title + ' — PlayStation';

const isVSCode = /Electron|Code\//i.test(navigator.userAgent);
const isCloudWithoutStorage = window.ContinueStorage ? window.ContinueStorage.isCloudWithoutStorage() : false;

function launchEmulator(gameUrl) {
  notice.style.display = 'grid';
  notice.innerHTML = '<span><b>💿 PREPARANDO SEU JOGO DE PLAYSTATION…</b>Iniciando emulador, aguarde alguns segundos...</span>';
  window.EJS_player = '#game';
  window.EJS_core = 'psx';
  window.EJS_gameUrl = gameUrl;
  window.EJS_biosUrl = '';
  window.EJS_defaultOptions = {
    'pcsx_rearmed_pad1type': 'dualshock',
    'pcsx_rearmed_analog_combo': 'L1 + R1 + Select'
  };
  window.EJS_defaultControls = window.ContinueControls
    ? window.ContinueControls.getEJSControls()
    : {
        0: {
          0: { value: 'z', value2: 'BUTTON_1' },
          1: { value: 's', value2: 'BUTTON_4' },
          2: { value: 'v', value2: 'SELECT' },
          3: { value: 'enter', value2: 'START' },
          4: { value: 'up arrow', value2: 'DPAD_UP' },
          5: { value: 'down arrow', value2: 'DPAD_DOWN' },
          6: { value: 'left arrow', value2: 'DPAD_LEFT' },
          7: { value: 'right arrow', value2: 'DPAD_RIGHT' },
          8: { value: 'x', value2: 'BUTTON_2' },
          9: { value: 'a', value2: 'BUTTON_3' },
          10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },
          11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },
          12: { value: 'tab', value2: 'LEFT_BOTTOM_SHOULDER' },
          13: { value: 'r', value2: 'RIGHT_BOTTOM_SHOULDER' }
        },
        1: {}, 2: {}, 3: {}
      };
  window.EJS_gameName = title;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_language = 'pt-BR';
  window.EJS_startOnLoaded = true;
  window.EJS_onGameStart = () => { notice.style.display = 'none'; };
  window.EJS_ready = () => { notice.style.display = 'none'; };

  const loader = document.createElement('script');
  loader.src = window.EJS_pathtodata + 'loader.js';
  loader.onerror = () => {
    notice.style.display = 'grid';
    notice.innerHTML = '<div style="background:#1e1e1e;padding:24px;border-radius:12px;border:2px solid #E60012;max-width:500px;pointer-events:auto;color:#eee"><b style="color:#E60012;font-size:16px;margin-bottom:8px">✕ ERRO AO BAIXAR O JOGO NA NUVEM</b>O arquivo do jogo não está disponível na nuvem ou deu 404.<br><br>👉 <b>Escolha o arquivo do jogo no seu PC ou celular para jogar agora:</b><br><br><label style="display:inline-block;background:#E60012;color:#FFF;font-weight:bold;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:14px">📁 Escolher Arquivo (.bin / .cue / .iso)<input type="file" id="fallback-rom-input" accept=".bin,.iso,.cue,.chd,.pbp,.zip" style="display:none"></label></div>';
    const fallbackInput = document.getElementById('fallback-rom-input');
    if (fallbackInput) {
      fallbackInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (file) launchEmulator(URL.createObjectURL(file));
      });
    }
  };
  document.body.appendChild(loader);
}

function showRomMissingScreen() {
  notice.style.display = 'grid';
  notice.innerHTML = `<div style="background:#181818;padding:28px 24px;border-radius:14px;border:1px solid #333;box-shadow:0 8px 30px rgba(0,0,0,0.8);max-width:480px;text-align:center;pointer-events:auto;line-height:1.5;color:#eee">
    <div style="font-size:40px;margin-bottom:8px">💿</div>
    <b style="color:#FFF;font-size:18px;display:block;margin-bottom:6px">${escapeHtml(title)}</b>
    <p style="color:#FFC107;font-size:13px;font-weight:bold;margin:0 0 10px 0">⚠️ Este jogo ainda não foi enviado para a nuvem da Cloudflare.</p>
    <p style="color:#9E9E9E;font-size:13px;margin:0 0 18px 0">Como jogos de PlayStation têm mais de 500MB, você pode jogar agora mesmo selecionando o arquivo do jogo (.bin / .cue / .iso) do seu aparelho:</p>
    <label style="display:inline-block;background:#E60012;color:#FFF;font-weight:bold;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:14px;box-shadow:0 4px 14px rgba(230,0,18,0.4)">
      📁 Selecionar Arquivo do Jogo (.bin / .cue / .iso)
      <input type="file" id="direct-rom-input" accept=".bin,.iso,.cue,.chd,.pbp,.zip" style="display:none">
    </label>
  </div>`;
  const directInput = document.getElementById('direct-rom-input');
  if (directInput) {
    directInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (file) launchEmulator(URL.createObjectURL(file));
    });
  }
}

if (isVSCode) {
  notice.innerHTML = '<div style="background:#1e1e1e;padding:24px;border-radius:12px;border:2px solid #E60012;max-width:500px;pointer-events:auto;line-height:1.6;color:#eee"><b style="color:#E60012;font-size:16px;margin-bottom:8px">⚠️ NAVEGADOR DO VS CODE NÃO SUPORTADO</b>O navegador interno do VS Code bloqueia aceleração gráfica (WebGL) e áudio de jogos.<br><br>👉 <b>Para jogar, abra no Google Chrome ou no navegador do celular:</b><br><code style="background:#000;color:#00e5ff;padding:6px 12px;border-radius:6px;display:inline-block;margin-top:10px;font-size:14px;font-weight:bold">http://localhost:4175</code></div>';
} else if (isCloudWithoutStorage && (!rom || rom.startsWith('/'))) {
  showRomMissingScreen();
} else if (!rom.startsWith('/PlayStation/GAMES/') && !rom.startsWith('/ps1/') && !rom.startsWith('http://') && !rom.startsWith('https://') && !rom.startsWith('blob:')) {
  notice.innerHTML = '<span><b>✕ JOGO NÃO ENCONTRADO</b>Escolha outro disco na lista abaixo.</span>';
} else {
  const finalRom = window.ContinueStorage ? window.ContinueStorage.resolveUrl(rom) : rom;
  if (finalRom.startsWith('http://') || finalRom.startsWith('https://')) {
    notice.style.display = 'grid';
    notice.innerHTML = '<span><b>💿 CONECTANDO AO SERVIDOR DE JOGOS…</b>Verificando se o jogo está disponível na nuvem...</span>';
    fetch(finalRom, { method: 'HEAD' }).then(res => {
      if (!res.ok && res.status === 404) {
        showRomMissingScreen();
      } else {
        launchEmulator(finalRom);
      }
    }).catch(() => {
      launchEmulator(finalRom);
    });
  } else {
    launchEmulator(finalRom);
  }
}
</script>
</body>
</html>
